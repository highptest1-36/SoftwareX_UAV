[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-shiftlab"
version = "1.0.0"
description = "An auditable and resumable framework for online test-time adaptation of UAV video object detectors"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Cao-Phuc Ha" },
    { name = "Anh Nguyen Vu Minh" },
    { name = "Huy Nguyen Quoc" },
    { name = "Bay Nguyen Van" },
    { name = "Ha Duong Thi Hong" },
    { name = "Thien Ho Huong" },
    { name = "Dzi Lam Tran Tuan" },
    { name = "Phu-Nguyen Le" },
]
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pycocotools>=2.0.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/highptest1-36/SoftwareX_UAV"

[project.scripts]
uavsl = "uav_shiftlab.cli:main"

[project.optional-dependencies]
fast-eval = ["faster-coco-eval>=1.6"]
# Detectron2 has no official PyPI wheels: install it separately (see docs/INSTALL.md), then `pip install .[d2]`.
d2 = ["torch>=2.1", "opencv-python>=4.8", "fvcore", "pillow", "setuptools<81"]
data = ["pillow"]   # tools/prepare_uavdt.py
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uav_shiftlab.backends.detectron2" = ["profiles/uavdt/*.yaml", "profiles/uavdt/*.json", "profiles/uavdt/tta/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
